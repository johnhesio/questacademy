<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Avatar - Quest Academy</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/avatar.css">
</head>
<body>

    <div class="avatar-container">
        <header>
            <h1>Avatar 8-Bit</h1>
            <p>Monte seu personagem no estilo Pixel Art!</p>
        </header>

        <div class="editor-grid">
            
            <div class="preview-area">
                <div class="avatar-box">
                    <img id="avatar-preview" src="" alt="Seu Avatar Pixel Art" onerror="this.src='https://api.dicebear.com/9.x/pixel-art/svg?seed=Error'">
                </div>
                <h3 id="player-name-display">Jogador</h3>
            </div>

            <div class="controls-area">
                
                <div class="control-group">
                    <label>👤 Gênero Base</label>
                    <div class="gender-options">
                        <button class="gender-btn active" id="btn-male" onclick="mudarGenero('male')">👨 Homem</button>
                        <button class="gender-btn" id="btn-female" onclick="mudarGenero('female')">👩 Mulher</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>🎨 Tom de Pele</label>
                    <div class="color-options" id="skin-colors"></div>
                </div>

                <div class="control-group">
                    <label>💇 Cabelo Pixelado</label>
                    <select id="hair-style" onchange="atualizarAvatar()"></select>
                </div>

                <div class="actions">
                    <button class="btn-primary" onclick="salvarAvatar()">Confirmar Heroi (8-Bit) 👾</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/avatar.js"></script>
</body>
</html>
