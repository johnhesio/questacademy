<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quest Academy</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-box">
        <h1>Quest Academy ⚔️</h1>
        <p>Entre para começar sua jornada.</p>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" placeholder="Seu nome..." required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" class="btn-primary">Iniciar Aventura</button>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
