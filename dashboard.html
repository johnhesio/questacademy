<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quest Academy</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="dashboard-container">
        
        <nav class="sidebar">
            <div class="logo">Quest Academy ⚔️</div>
            <div class="menu">
                <ul>
                    <li><a href="#" class="active">📊 Painel Principal</a></li>
                    <li><a href="#missions-list">📜 Missões</a></li>
                    <li><a href="#badges-area">🏆 Conquistas</a></li>
                </ul>
            </div>
        </nav>

        <main class="main-content">
            
            <header class="top-bar">
                <div class="user-profile-area">
                    <img id="user-avatar" src="" alt="Avatar" class="avatar-img">
                    
                    <div class="user-info">
                        <h1>Olá, <span id="user-name">Estudante</span>!</h1>
                        <p class="user-class">Classe: <span id="user-class">...</span></p>
                        
                        <div class="xp-container">
                            <div class="xp-info">
                                <span>Nível <strong id="user-level">1</strong></span>
                                <span><span id="current-xp">0</span> / <span id="next-level-xp">100</span> XP</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" id="xp-bar" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button class="btn-logout" onclick="logout()">Sair</button>
            </header>

            <section class="content-area">
                <h2>📜 Quadro de Missões</h2>
                <div id="missions-list" class="missions-grid"></div>
            </section>

            <section class="content-area" id="badges-area">
                <h2 style="margin-top: 40px;">🏆 Galeria de Conquistas</h2>
                <p>Desbloqueie medalhas completando objetivos.</p>
                <div id="badges-list" class="badges-grid">
                    </div>
            </section>

        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
