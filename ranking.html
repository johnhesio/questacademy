<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Quest Academy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css"> <link rel="stylesheet" href="css/ranking.css">    </head>
<body>

    <div class="dashboard-container">
        
        <nav class="sidebar">
            <div class="logo">Quest Academy ⚔️</div>
            <div class="menu">
                <ul>
                    <li><a href="dashboard.html">📊 Painel Principal</a></li>
                    <li><a href="dashboard.html#missions-list">📜 Missões</a></li>
                    <li><a href="#" class="active">🏆 Ranking</a></li>
                </ul>
            </div>
        </nav>

        <main class="main-content">
            
            <header class="top-bar">
                <div>
                    <h1>🏆 Hall da Fama</h1>
                    <p>Os melhores estudantes da academia.</p>
                </div>
                <button onclick="window.location.href='dashboard.html'" class="btn-logout" style="background:#636e72;">Voltar</button>
            </header>

            <section class="ranking-area">
                
                <div class="ranking-card">
                    <table id="ranking-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Aluno</th>
                                <th>Nível</th>
                                <th>XP Total</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-body">
                            </tbody>
                    </table>
                </div>

            </section>

        </main>
    </div>

    <script src="js/ranking.js"></script>
</body>
</html>
